<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07140e">
<title>In-Between: the card game</title>
<meta name="description" content="In-Between, the card game of betting on the card in the middle. Play with friends around one screen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg0: #e6efe9;
  --bg1: #c4d9cb;
  --panel: rgba(250, 253, 251, .82);
  --panel-solid: #f5f9f6;
  --panel2: rgba(20, 50, 36, .08);
  --ink: #10231a;
  --muted: #4a6254;
  --line: rgba(20, 50, 36, .2);
  --accent: #c58f1b;
  --accent-ink: #1c1405;
  --brass: #8a5f0a;
  --win: #0f6b3a;
  --lose: #b0372b;
  --focus: #1a64c4;
  --shadow: 0 10px 28px rgba(10, 40, 25, .22);
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg0: #050f0a; --bg1: #123325; --panel: rgba(14, 36, 26, .82); --panel-solid: #0f261b; --panel2: rgba(255, 255, 255, .06);
    --ink: #e8f2ec; --muted: #9fb8a8; --line: rgba(255, 255, 255, .15); --accent: #e4b64f; --accent-ink: #1c1405; --brass: #e4b64f;
    --win: #62d79c; --lose: #ff8c7a; --focus: #7db4ff; --shadow: 0 10px 28px rgba(0, 0, 0, .45);
  }
}
:root[data-theme="dark"] {
  --bg0: #050f0a; --bg1: #123325; --panel: rgba(14, 36, 26, .82); --panel-solid: #0f261b; --panel2: rgba(255, 255, 255, .06);
  --ink: #e8f2ec; --muted: #9fb8a8; --line: rgba(255, 255, 255, .15); --accent: #e4b64f; --accent-ink: #1c1405; --brass: #e4b64f;
  --win: #62d79c; --lose: #ff8c7a; --focus: #7db4ff; --shadow: 0 10px 28px rgba(0, 0, 0, .45);
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; overflow: hidden; overscroll-behavior: none; scroll-padding-top: env(safe-area-inset-top, 0px); }
@supports (height: 100dvh) { html { height: 100dvh; } }
body {
  height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; touch-action: manipulation;
  color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.35;
  background: var(--bg0) radial-gradient(ellipse 90% 70% at 50% 38%, var(--bg1), var(--bg0) 75%);
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
input { user-select: text; -webkit-user-select: text; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.sr { position: fixed; top: 0; left: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

#app { position: relative; height: 100%; }
.view { position: absolute; inset: 0; }
#gameView { display: grid; grid-template-rows: auto minmax(0, 1fr); }

/* ---------- top bar ---------- */
.hud { display: flex; align-items: center; gap: 8px; padding: 8px 10px 6px; min-width: 0; }
.ibtn { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); color: var(--ink); box-shadow: var(--shadow); }
.bank { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 4px 16px 4px 5px; border-radius: 999px; color: #eaf4ed; border: 1px solid rgba(255,255,255,.2); background: linear-gradient(180deg, #14604a, #0b3727); box-shadow: var(--shadow); }
.bank .chip { flex: none; width: 36px; height: 36px; border-radius: 50%; position: relative; background: repeating-conic-gradient(from -7.5deg, #f2eddc 0 15deg, #b8322a 15deg 30deg); box-shadow: 0 2px 4px rgba(0,0,0,.4); }
.bank .chip::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: #0f4a36; box-shadow: inset 0 0 0 2px #f2eddc; }
.bank small { display: block; font-size: 11px; opacity: .8; line-height: 1; }
.bank strong { font-family: var(--display); font-size: clamp(20px, 5.4vw, 28px); line-height: 1.05; font-variant-numeric: tabular-nums; }
.spacer { flex: 1; min-width: 0; }
.pill { display: grid; padding: 4px 10px; min-width: 50px; text-align: center; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.pill small { font-size: 10px; color: var(--muted); line-height: 1.2; }
.pill b { font-family: var(--display); font-size: 16px; line-height: 1.1; font-variant-numeric: tabular-nums; }
@media (max-width: 430px) { .deckpill { display: none; } }

/* ---------- main area ---------- */
#main { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 8px; padding: 0 10px 10px; min-height: 0; }
#stageWrap { position: relative; aspect-ratio: 7 / 5; min-height: 0; max-height: 100%; }
#stage { position: absolute; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: manipulation; }
@media (min-aspect-ratio: 6/5) {
  #main { grid-template-columns: minmax(0, 1fr) minmax(300px, min(380px, 34vw)); grid-template-rows: minmax(0, 1fr); }
  #stageWrap { aspect-ratio: auto; height: 100%; }
}

#toast { position: absolute; left: 50%; top: 46%; z-index: 3; transform: translate(-50%, -40%); opacity: 0; pointer-events: none; max-width: 94%; padding: 8px 18px; border-radius: 999px; text-align: center;
  font-family: var(--display); font-weight: 800; font-size: clamp(15px, 4.2vw, 22px); background: var(--panel-solid); color: var(--ink); border: 2px solid var(--line); box-shadow: var(--shadow); }
#toast.show { opacity: 1; transform: translate(-50%, -50%); }
#toast.win { border-color: var(--win); color: var(--win); }
#toast.post { border-color: var(--brass); color: var(--brass); }
#toast.lose { border-color: var(--lose); color: var(--lose); }
@media (prefers-reduced-motion: no-preference) { #toast { transition: opacity .25s, transform .25s; } }

#zoom { position: absolute; z-index: 4; left: 50%; bottom: 8px; transform: translateX(-50%); width: min(94%, 360px); padding: 10px 12px 12px; border-radius: 16px; background: var(--panel-solid); border: 1px solid var(--line); box-shadow: var(--shadow); }
#zoom .zhead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
#zoom .zname { font-family: var(--display); font-weight: 800; font-size: 18px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#zoom .znet { font-family: var(--display); font-weight: 600; font-variant-numeric: tabular-nums; }
#zoom .ibtn { width: 36px; height: 36px; margin-left: auto; box-shadow: none; }

/* ---------- console (the action area) ---------- */
.console { container-type: size; display: flex; flex-direction: column; gap: 10px; min-height: 0; padding: 14px; overflow: hidden; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: var(--shadow); }
.c-title { font-family: var(--display); font-weight: 800; font-size: clamp(20px, 5.6vw, 26px); line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
.c-fill { flex: 1; min-height: 0; }
.btn { min-height: 46px; padding: 8px 16px; border-radius: 12px; font-weight: 600; background: var(--panel2); border: 1px solid var(--line); color: var(--ink); }
.btn:hover { filter: brightness(1.06); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 88%, #fff), var(--accent)); color: var(--accent-ink); border-color: transparent; font-weight: 800; font-size: 17px; box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 55%, #000), 0 8px 18px rgba(0,0,0,.25); }
.btn.primary:active { transform: translateY(2px); box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 55%, #000); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 38px; padding: 4px 12px; font-size: 14px; }
.btn.warn { background: color-mix(in srgb, var(--lose) 22%, transparent); color: var(--lose); border-color: var(--lose); }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; min-width: 0; }
.stepper { display: grid; grid-template-columns: 54px minmax(0, 1fr) 54px; gap: 8px; }
.stepper .btn { font-size: 24px; font-weight: 800; padding: 0; }
.bet-input { width: 100%; min-height: 46px; text-align: center; font-family: var(--display); font-weight: 800; font-size: 28px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.bet-input::-webkit-outer-spin-button, .bet-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.err { min-height: 1.2em; color: var(--lose); font-weight: 600; font-size: 14px; }
.banner { padding: 10px 12px; border-radius: 12px; font-weight: 700; border-left: 6px solid var(--line); background: var(--panel2); }
.banner.win { color: var(--win); border-left-color: var(--win); background: color-mix(in srgb, var(--win) 16%, transparent); }
.banner.post { color: var(--brass); border-left-color: var(--brass); background: color-mix(in srgb, var(--brass) 16%, transparent); }
.banner.lose { color: var(--lose); border-left-color: var(--lose); background: color-mix(in srgb, var(--lose) 16%, transparent); }
.dots::after { content: ""; display: inline-block; width: 1.4em; text-align: left; animation: dots 1.2s steps(4, end) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75%, 100% { content: "..."; } }
@media (prefers-reduced-motion: reduce) { .dots::after { animation: none; content: "..."; } }

@container (max-height: 330px) {
  .console { gap: 7px; padding: 12px; }
  .c-title { font-size: 20px; }
  .c-sub { display: none; }
  .console .hand3d.big { --cw: clamp(34px, min(22cqw, 15cqh), 80px); }
  .btn.primary { min-height: 42px; }
  .stepper .btn, .bet-input { min-height: 40px; }
}
@container (max-height: 260px) { .quick { display: none; } }
@container (max-width: 380px) { .btn.primary { font-size: 15px; } }

/* ---------- 3D-style playing cards in the interface ---------- */
.hand3d { display: flex; align-items: center; justify-content: center; gap: calc(var(--cw, 56px) * .16); perspective: 800px; }
.hand3d.big { --cw: 64px; --cw: clamp(40px, min(26cqw, 20cqh), 104px); }
.hand3d.mini { --cw: 30px; gap: 4px; }
.hand3d.zoom { --cw: 78px; }
.pc { position: relative; width: var(--cw); aspect-ratio: 5 / 7; flex: none; display: grid; place-items: center; border-radius: calc(var(--cw) * .11); background: linear-gradient(160deg, #fffdf6, #f1ecda); color: #16231c;
  box-shadow: 0 calc(var(--cw) * .1) calc(var(--cw) * .22) rgba(0,0,0,.4), inset 0 0 0 1px #d4cdb6; font-family: var(--display); font-weight: 800; transform: rotateX(14deg); transform-origin: 50% 100%; }
.pc.red { color: #b3261e; }
.pc .r { position: absolute; left: 9%; top: 4%; font-size: calc(var(--cw) * .32); line-height: 1.1; }
.pc .s { font-size: calc(var(--cw) * .56); line-height: 1; margin-top: calc(var(--cw) * .12); }
.pc.gap { background: transparent; border: 2px dashed var(--line); box-shadow: none; color: var(--muted); font-weight: 600; transform: none; }
.pc.gap .q { font-size: calc(var(--cw) * .45); }
.pc.win { box-shadow: 0 0 0 3px var(--win), 0 0 24px var(--win); }
.pc.post { box-shadow: 0 0 0 3px var(--brass), 0 0 24px var(--brass); }
.pc.lose { box-shadow: 0 0 0 3px var(--lose), 0 0 24px var(--lose); }
@keyframes flipin { from { transform: rotateY(180deg) scale(.85); } to { transform: rotateX(14deg); } }
@media (prefers-reduced-motion: no-preference) { .pc.flip { animation: flipin .6s cubic-bezier(.2, .8, .2, 1); } }

/* ---------- setup ---------- */
.setup { position: absolute; inset: 0; display: grid; gap: 10px; grid-template-rows: auto minmax(0, 1fr) auto; padding: 14px; max-width: 560px; margin: 0 auto; }
.hero { display: grid; justify-items: center; gap: 4px; padding-top: 2px; }
.fan { position: relative; height: clamp(70px, 17dvh, 132px); width: 100%; perspective: 700px; }
.fan .pc { --cw: clamp(40px, 9dvh, 76px); position: absolute; left: 50%; top: 50%; transform-origin: 50% 90%; }
.fan .pc:nth-child(1) { transform: translate(-50%, -50%) translateX(calc(var(--cw) * -.85)) rotateZ(-14deg) rotateX(16deg); }
.fan .pc:nth-child(2) { transform: translate(-50%, -50%) translateY(calc(var(--cw) * -.1)) rotateX(16deg); background: repeating-linear-gradient(45deg, #9e2b25 0 7px, #7e211c 7px 14px); box-shadow: inset 0 0 0 3px #f2eddc, 0 8px 16px rgba(0,0,0,.4); }
.fan .pc:nth-child(3) { transform: translate(-50%, -50%) translateX(calc(var(--cw) * .85)) rotateZ(14deg) rotateX(16deg); }
.hero h1 { font-family: var(--display); font-weight: 800; font-size: clamp(32px, 8.5vw, 52px); line-height: 1; letter-spacing: -.01em; }
.hero p { color: var(--muted); font-size: 15px; text-align: center; }
.sform { display: grid; gap: 10px; min-height: 0; align-content: start; }
.lbl span { white-space: nowrap; }
.lbl { font-weight: 600; font-size: 13px; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; }
.pgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.pchip { display: flex; align-items: center; gap: 2px; height: clamp(32px, 5.4dvh, 42px); padding: 0 2px 0 10px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); min-width: 0; }
.pchip input { flex: 1; min-width: 0; height: 100%; background: transparent; border: 0; outline-offset: 0; font-weight: 600; font-size: 15px; }
.pchip .x { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border: 0; background: transparent; border-radius: 8px; color: var(--muted); }
.pchip.add { justify-content: center; padding: 0 10px; border-style: dashed; font-weight: 600; color: var(--muted); background: transparent; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.seg button { min-height: 44px; border-radius: 10px; font-weight: 600; font-size: 14px; background: var(--panel2); border: 2px solid var(--line); padding: 4px 8px; line-height: 1.15; }
.seg button[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 30%, transparent); border-color: var(--accent); }
.linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; min-height: 36px; font-size: 14px; justify-self: center; }
.pgmini { display: inline-flex; align-items: center; gap: 6px; }
.pgmini button { min-width: 30px; height: 26px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); font-size: 16px; line-height: 1; padding: 0; }
.pgmini button:disabled { opacity: .35; }
#setupErr:empty { display: none; }
@media (max-height: 660px) { .hero p { display: none; } .fan { height: 62px; } .sform { gap: 8px; } .seg button { min-height: 38px; } .setup .stepper .btn, .setup .bet-input { min-height: 40px; } }
@media (max-height: 540px) { .fan { display: none; } .setup { gap: 6px; padding: 10px 14px; } .hero h1 { font-size: 28px; } }
@media (min-aspect-ratio: 6/5) {
  .setup { max-width: 920px; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); grid-template-rows: minmax(0, 1fr) auto; column-gap: 24px; align-items: center; }
  .hero { grid-row: 1; align-self: center; }
  .fan { height: clamp(90px, 28dvh, 190px); }
  .sform { grid-row: 1; grid-column: 2; align-self: center; }
  .setup > .linkbtn { grid-row: 2; grid-column: 1 / -1; }
}

/* ---------- menu sheet ---------- */
.sheet { position: fixed; inset: 0; z-index: 30; display: grid; place-items: end center; background: rgba(2, 8, 5, .62); }
.sheet-card { width: min(600px, 100%); height: 78vh; height: min(78dvh, 640px); display: flex; flex-direction: column; overflow: hidden; border-radius: 22px 22px 0 0; background: var(--panel-solid); border: 1px solid var(--line); box-shadow: var(--shadow); padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (min-aspect-ratio: 6/5) { .sheet { place-items: center; } .sheet-card { border-radius: 22px; height: 88vh; height: min(88dvh, 560px); } }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px 6px 16px; }
.sheet-head h2 { font-family: var(--display); font-weight: 800; font-size: 22px; flex: 1; }
.sheet-head .ibtn { box-shadow: none; }
.tabs { display: flex; gap: 6px; padding: 0 12px 8px; }
.tabs button { flex: 1; min-height: 40px; border-radius: 10px; background: transparent; border: 1px solid var(--line); font-weight: 600; font-size: 14px; padding: 0 4px; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.sheet-body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; padding: 0 12px 10px; }
.slist { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
.srow { flex: none; height: var(--rh, 56px); display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 12px; background: var(--panel2); border: 1px solid transparent; overflow: hidden; min-width: 0; }
.srow.now { border-color: var(--accent); }
.srow.gone { opacity: .6; }
.srow .grow { flex: 1; min-width: 0; }
.srow .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .tag { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 999px; font-size: 11px; font-weight: 700; background: var(--accent); color: var(--accent-ink); vertical-align: 1px; }
.srow .tag.d { background: #0f4a36; color: #eaf4ed; }
.srow .net { font-family: var(--display); font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
.pos { color: var(--win); } .neg { color: var(--lose); }
.srow.lg { align-items: center; border-left: 4px solid var(--line); border-radius: 8px; font-size: 14px; }
.srow.lg.k-win { border-left-color: var(--win); } .srow.lg.k-lose { border-left-color: var(--lose); } .srow.lg.k-post { border-left-color: var(--brass); }
.srow.lg .txt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pager { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 8px; height: 52px; }
.pager span { color: var(--muted); font-size: 14px; }
.pager .btn { min-width: 84px; }
.stitle { flex: none; font-weight: 700; margin: 2px 2px 6px; font-size: 15px; }
.rules li { margin: 0 0 8px; }
.rules ul { margin: 0; padding-left: 20px; }
.note { flex: none; font-size: 13px; color: var(--muted); margin: 0 2px 6px; }
.foot { flex: none; display: flex; gap: 8px; padding-top: 8px; }
.foot .btn { flex: 1; }
</style>
</head>
<body>
<div id="app">
  <div id="setupView" class="view"></div>
  <div id="gameView" class="view" hidden>
    <header class="hud" id="hud"></header>
    <main id="main">
      <section id="stageWrap" aria-label="Card table">
        <div id="stage"></div>
        <div id="toast"></div>
        <div id="zoom" hidden></div>
      </section>
      <aside id="console" class="console" aria-live="polite"></aside>
    </main>
  </div>
</div>
<div id="sheet" class="sheet" hidden></div>
<div id="live" class="sr" aria-live="polite"></div>

<script src="vendor/three.min.js"></script>
<script>
(function () {
  "use strict";

  var STORE = "inbetween-game-v4";
  var MAXP = 12;
  var SUITS = ["\u2660", "\u2665", "\u2666", "\u2663"];

  var reduced = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  var setup = { names: ["Player 1", "Player 2", "Player 3"], ante: 10, recollect: "round" };
  var game = null;
  var ui = { bet: "", err: "", justDrew: false, zoomSeat: -1 };
  var busy = false;
  var stage = null;
  var setupPage = 0, maxH = {};
  var sheet = { open: false, tab: "players", page: { players: 0, log: 0, rules: 0, settle: 0 }, armedLeave: -1, armedNew: false };
  var timers = { leave: null, nw: null, toast: null, zoom: null };

  var ICON = {
    menu: '<svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',

    off: '<svg class="ic" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor"/><path d="m16 9 5 6M21 9l-5 6"/></svg>'

  /* ---------- helpers ---------- */
  function $(id) { return document.getElementById(id); }

  function fmtSigned(n) { n = r2(n); if (n === 0) return "0"; return (n > 0 ? "+" : "\u2212") + fmt(Math.abs(n)); }
  function cls(n) { return n > 0 ? "pos" : n < 0 ? "neg" : ""; }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, reduced ? Math.min(ms, 60) : ms); }); }
  function rand(n) {
    if (window.crypto && window.crypto.getRandomValues) { var a = new Uint32Array(1); window.crypto.getRandomValues(a); return a[0] % n; }
    return Math.floor(Math.random() * n);
  }

  function save() { try { localStorage.setItem(STORE, JSON.stringify({ setup: setup, game: game })); } catch (e) { /* storage may be unavailable */ } }
  function load() {

      if (d && d.game && Array.isArray(d.game.players) && Array.isArray(d.game.deck)) {
        game = d.game;
        game.deckSize = game.deckSize || 52;
        game.recollect = game.recollect === "deal" ? "deal" : "round";
        if (game.phase !== "over") {
          /* cards on the table are not restored, so begin with a fresh deal */
          game.phase = "ready"; game.hands = {}; game.order = []; game.pos = 0;
          if (game.roundEnded || game.bank <= 0) startNewRound();

  }

  /* ---------- sound (all synthesized, no files) ---------- */
  var sfx = (function () {
    var ctx = null, master = null, noiseBuf = null, muted = false;
    try { muted = localStorage.getItem("inbetween-muted") === "1"; } catch (e) { /* ignore */ }

      if (ctx) return ctx;
      var AC = window.AudioContext || window.webkitAudioContext;

      ctx = new AC();
      master = ctx.createGain(); master.gain.value = muted ? 0 : 0.7; master.connect(ctx.destination);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      return ctx;
    }
    function unlock() { var c = ensure(); if (c && c.state === "suspended") c.resume(); }
    function tone(freq, dur, o) {
      var c = ensure(); if (!c || muted) return;
      o = o || {};
      var t = c.currentTime + (o.delay || 0), osc = c.createOscillator(), g = c.createGain();
      osc.type = o.type || "sine";
      osc.frequency.setValueAtTime(freq, t);
      if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t + dur);
      var vol = o.gain == null ? 0.2 : o.gain;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + (o.attack || 0.006));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g);
      var out = g;

    function chips(n) {
      n = Math.min(8, Math.max(2, n || 4));

        var d = i * 0.05 + Math.random() * 0.025;
        tone(2300 + Math.random() * 1700, 0.11, { type: "triangle", gain: 0.12, delay: d });
        tone(5200 + Math.random() * 2200, 0.06, { gain: 0.04, delay: d });
      }
    }
    function play(name, arg) {
      switch (name) {
        case "click": tone(760, 0.04, { type: "square", gain: 0.04 }); break;
        case "deal": noise(0.08, { freq: 2800, sweep: 900, q: 0.8, gain: 0.22 }); tone(190, 0.05, { gain: 0.07 }); break;
        case "flip": noise(0.1, { freq: 1700, sweep: 3400, q: 0.7, gain: 0.17 }); tone(330, 0.06, { type: "triangle", gain: 0.06 }); break;
        case "turn": tone(540, 0.09, { type: "triangle", slide: 270, gain: 0.16 }); break;
        case "chips": chips(arg); break;
        case "win":
          [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { tone(f, 0.36, { type: "triangle", gain: 0.17, delay: i * 0.1 }); });
          chips(6); break;
        case "lose":
          tone(196, 0.5, { type: "sawtooth", slide: 98, gain: 0.12, lp: 700 });
          tone(147, 0.62, { type: "sawtooth", slide: 82, gain: 0.1, lp: 600, delay: 0.14 }); break;
        case "post":
          tone(330, 0.2, { type: "square", gain: 0.07 }); tone(349, 0.2, { type: "square", gain: 0.07 });
          tone(120, 0.22, { type: "sine", gain: 0.2, delay: 0.1 }); break;
        case "pass": tone(420, 0.14, { type: "sine", slide: 300, gain: 0.08 }); break;
        case "shuffle":
          for (var i = 0; i < 9; i++) noise(0.07, { freq: 1200 + Math.random() * 2400, q: 0.9, gain: 0.14, delay: i * 0.055 });
          break;

          [392, 523.25, 659.25, 783.99].forEach(function (f, i) { tone(f, 0.9, { type: "triangle", gain: 0.11, delay: i * 0.05, attack: 0.03 }); });
          noise(0.7, { freq: 4000, sweep: 9000, q: 0.5, gain: 0.07 }); break;
        case "leave": tone(300, 0.3, { type: "triangle", slide: 150, gain: 0.12 }); break;
        case "error": tone(160, 0.16, { type: "square", gain: 0.06 }); break;

    function setMuted(v) {
      muted = !!v;

  function snd(name, delay, arg) {

  }

  /* ---------- cards and rules ---------- */
  function decksFor(n) { return Math.max(1, Math.ceil(3 * n / 52)); }
  function newDeck(decks) {
    var d = [];
    for (var k = 0; k < decks; k++) for (var s = 0; s < 4; s++) for (var r = 1; r <= 13; r++) d.push({ r: r, s: s });
    for (var i = d.length - 1; i > 0; i--) { var j = rand(i + 1); var t = d[i]; d[i] = d[j]; d[j] = t; }
    return d;
  }
  function cardName(c) { return RANKLBL[c.r] + SUITS[c.s]; }
  function val(c) { return c.r; }                     /* the ace is always low */
  function sortedPair(h) { return val(h.c1) <= val(h.c2) ? [h.c1, h.c2] : [h.c2, h.c1]; }
  function gapOf(h) { return Math.max(0, Math.abs(val(h.c1) - val(h.c2)) - 1); }

  }
  function isFive(n) { return Math.abs(n / 5 - Math.round(n / 5)) < 1e-9; }
  function maxBet() { return Math.floor(game.bank / 5 + 1e-9) * 5; }

  function nextActive(i) {
    var n = game.players.length;
    for (var k = 1; k <= n; k++) { var j = (i + k) % n; if (!game.players[j].left) return j; }
    return -1;
  }
  function activeList() { return game.players.filter(function (p) { return !p.left; }); }
  function pot() { return Math.max(game.ante, activeList().length * game.ante); }
  function playOrder() {

  }
  function isLive() { return game.phase === "bet" || game.phase === "drawing" || game.phase === "result" || game.phase === "focusing"; }

  /* ---------- game flow ---------- */
  function startGame() {
    var names = setup.names.map(function (n) { return n.trim(); }).filter(Boolean);
    var ante = parseFloat(setup.ante);
    if (names.length < 2) return "Add at least two players.";
    if (names.length > MAXP) return "The table seats up to " + MAXP + " players.";
    if (!(ante > 0) || !isFive(ante)) return "The boat must be a multiple of 5.";
    var deck = newDeck(decksFor(names.length));
    game = {
      players: names.map(function (n) { return { name: n, net: -ante, left: false }; }),
      ante: ante, bank: r2(names.length * ante), round: 1, dealer: 0, turn: 0, pos: 0, order: [], hands: {},
      recollect: setup.recollect, deck: deck, deckSize: deck.length, phase: "ready",
      lastResult: null, roundEnded: false, log: []
    };
    game.turn = nextActive(game.dealer);
    game.log.push({ kind: "info", text: "Round 1 begins. " + names.length + " players put in the boat of " + fmt(ante) + ". Bank is " + fmt(game.bank) + ". " + game.players[0].name + " deals." });
    ui = { bet: "", err: "", justDrew: false, zoomSeat: -1 };
    return "";
  }

  /* A new round: every card is recollected into a fresh shuffled deck, boats are collected, the deal moves on. */
  function startNewRound() {
    game.round += 1;

    game.dealer = nextActive(game.dealer);

  }

  async function deal() {
    if (busy || game.phase !== "ready" || activeList().length < 2) return;
    busy = true; closeZoom();
    var n = activeList().length;
    if (game.deck.length < 3 * n) {
      game.phase = "collecting"; render();
      sfx.play("shuffle");
      await stage.collectAll();
      game.deck = newDeck(decksFor(n)); game.deckSize = game.deck.length;
      game.log.push({ kind: "info", text: "The deck ran low. All cards were recollected and shuffled." });
    }
    game.order = playOrder();
    game.pos = 0;
    game.hands = {};
    game.order.forEach(function (i) {
      game.hands[i] = { c1: game.deck.pop(), c2: game.deck.pop(), c3: null, state: "wait", outcome: null, bet: null };
    });

    game.phase = "dealing";
    render();
    var seats = game.order.map(function (i) { var sp = sortedPair(game.hands[i]); return { i: i, l: sp[0], r: sp[1] }; });
    await stage.dealAll(seats);
    game.pos = 0;
    game.turn = game.order[0];
    await beginTurn();
  }

  async function beginTurn() {
    ui.err = ""; ui.justDrew = false;
    ui.bet = String(Math.max(5, Math.min(game.ante, maxBet())));
    sfx.play("turn");
    await stage.focus(game.turn);
    game.phase = "bet"; busy = false;
    render(); save();
    announce(game.players[game.turn].name + ", your turn.");
  }

  function toast(text, kind) {
    var t = $("toast");

    clearTimeout(timers.toast);
    timers.toast = setTimeout(function () { t.className = ""; }, 2400);
  }

  async function play() {
    if (busy || game.phase !== "bet") return;

    ui.err = "";

    else if (!isFive(bet)) ui.err = "Bets must be a multiple of 5.";
    else if (bet > maxBet() + 1e-9) ui.err = "The most you can bet is " + fmt(maxBet()) + ".";
    if (ui.err) { sfx.play("error"); toast(ui.err, "lose"); return; }

    busy = true; game.phase = "drawing"; h.bet = bet;
    render();
    sfx.play("chips", Math.round(bet / 5));
    h.c3 = game.deck.pop();
    await stage.reveal(game.turn, h.c3);

    var out = evaluate(h);
    h.outcome = out; h.state = "done";
    var p = game.players[game.turn];
    var text, logText, tmsg;
    var cards = cardName(h.c1) + ", " + cardName(h.c2) + " then " + cardName(h.c3);
    if (out === "win") {
      p.net = r2(p.net + bet); game.bank = r2(game.bank - bet);
      text = "Between! " + p.name + " wins " + fmt(bet) + " from the bank.";
      logText = p.name + " bet " + fmt(bet) + ": " + cards + ". Won " + fmt(bet) + ".";
      tmsg = "Between!  +" + fmt(bet);
    } else {
      p.net = r2(p.net - bet); game.bank = r2(game.bank + bet);
      text = out === "post" ? "Hit a card. " + p.name + " is fined " + fmt(bet) + "." : "Outside. " + p.name + " loses " + fmt(bet) + " to the bank.";
      logText = p.name + " bet " + fmt(bet) + ": " + cards + ". " + (out === "post" ? "Hit a card, fined " : "Outside, lost ") + fmt(bet) + ".";
      tmsg = (out === "post" ? "Hit a card  \u2212" : "Outside  \u2212") + fmt(bet);
    }
    game.lastResult = { kind: out, text: text };
    game.log.push({ kind: out, text: logText });
    game.roundEnded = game.bank <= 0;
    game.phase = "result"; ui.justDrew = true;
    sfx.play(out);
    stage.flash(out, game.turn);
    if (out === "win") stage.burst(game.turn); else if (out === "lose") stage.shake(game.turn);
    stage.fly(out === "win" ? "toPlayer" : "toBank", game.turn, Math.round(bet / 5));
    toast(tmsg, out);
    announce(text);
    busy = false;
    save(); render();
  }

  async function advance() {
    if (game.roundEnded) {
      busy = true; game.phase = "collecting"; render();
      sfx.play("roundEnd"); sfx.play("shuffle");
      await stage.collectAll();
      startNewRound();
      game.hands = {}; game.order = []; game.phase = "ready"; busy = false;
      save(); render();
      return;
    }
    var pos = game.pos + 1;
    while (pos < game.order.length && game.players[game.order[pos]].left) pos++;
    if (pos < game.order.length) {
      game.pos = pos; game.turn = game.order[pos];
      busy = true; game.phase = "focusing";
      render();
      await beginTurn();
      return;
    }
    game.log.push({ kind: "info", text: "Everyone has played. The deal moves to the next player." });
    if (game.recollect === "deal") {
      busy = true; game.phase = "collecting"; render();
      sfx.play("shuffle");
      await stage.collectAll();
      game.deck = newDeck(decksFor(activeList().length)); game.deckSize = game.deck.length;
      game.log.push({ kind: "info", text: "All cards were recollected and shuffled." });
    } else {
      stage.discardAll();
    }
    game.hands = {}; game.order = [];
    game.dealer = nextActive(game.dealer);
    game.turn = nextActive(game.dealer);
    game.phase = "ready"; busy = false;
    save(); render();
  }

  async function pass() {
    if (busy || game.phase !== "bet") return;
    game.hands[game.turn].state = "pass";

    await advance();
  }
  async function next() {

  }

    if (busy) return;

    p.left = true;

    sfx.play("leave");
    game.log.push({ kind: "info", text: p.name + " left the game with a net of " + fmtSigned(p.net) + " and gave up any share of the bank." });
    if (activeList().length < 2) {
      stage.discardAll(); game.hands = {}; game.order = []; game.phase = "over";
      save(); render(); sheet.open = true; sheet.tab = "settle"; renderSheet();
      return;
    }
    if (i === game.dealer) game.dealer = nextActive(i);
    var h = game.hands[i];
    if (h) { h.state = "left"; stage.discardHand(i); }
    if (i === game.turn && game.phase === "bet") { advance(); }
    save(); render();
  }

  /* ---------- rendering: game ---------- */
  function cardEl(c, extra) {
    var red = c.s === 1 || c.s === 2;
    return '<div class="pc' + (red ? " red" : "") + (extra ? " " + extra : "") + '"><span class="r">' + RANKLBL[c.r] + '</span><span class="s">' + SUITS[c.s] + '</span></div>';
  }
  function handEl(h, size, flipMid) {
    var sp = sortedPair(h);
    var mid = h.c3 ? cardEl(h.c3, (h.outcome || "") + (flipMid ? " flip" : "")) : '<div class="pc gap"><span class="q">?</span></div>';
    return '<div class="hand3d ' + size + '" role="group" aria-label="Cards ' + cardName(sp[0]) + (h.c3 ? ", " + cardName(h.c3) : "") + ", " + cardName(sp[1]) + '">' + cardEl(sp[0]) + mid + cardEl(sp[1]) + '</div>';
  }

  function hudHTML() {
    return '<button class="ibtn" data-act="openSheet" aria-label="Open menu">' + ICON.menu + '</button>' +
      '<div class="bank" role="group" aria-label="Bank"><span class="chip"></span><span><small>Bank</small><strong>' + fmt(game.bank) + '</strong></span></div>' +
      '<span class="spacer"></span>' +
      '<div class="pill"><small>Round</small><b>' + game.round + '</b></div>' +
      '<div class="pill deckpill"><small>Deck</small><b>' + game.deck.length + '</b></div>' +
      '<button class="ibtn" data-act="mute" aria-pressed="' + sfx.isMuted() + '" aria-label="' + (sfx.isMuted() ? "Turn sound on" : "Turn sound off") + '">' + (sfx.isMuted() ? ICON.off : ICON.on) + '</button>';
  }

  function consoleHTML() {
    var ph = game.phase, dealer = game.players[game.dealer];
    if (ph === "over") {
      var w = activeList()[0];
      return '<div><div class="c-title">Game over</div><div class="c-sub">' + (w ? esc(w.name) + " is the last player at the table." : "Everyone has left.") + '</div></div><div class="c-fill"></div>' +
        '<button class="btn primary" data-act="openSettle">Settle up</button>';
    }
    if (ph === "ready") {
      var first = game.players[nextActive(game.dealer)];
      return '<div><div class="c-title">' + esc(dealer.name) + ' deals</div><div class="c-sub">Two cards each, face up. ' + esc(first.name) + ' bets first.</div></div><div class="c-fill"></div>' +
        '<button class="btn primary" data-act="deal">Deal two cards to everyone</button>';
    }
    if (ph === "dealing") return '<div><div class="c-title">Dealing</div><div class="c-sub">' + esc(dealer.name) + ' deals two cards to every player<span class="dots"></span></div></div>';
    if (ph === "collecting") return '<div><div class="c-title">Collecting the cards</div><div class="c-sub">Every card goes back into the deck and is shuffled<span class="dots"></span></div></div>';
    var p = game.players[game.turn], h = game.hands[game.turn];
    var prog = "Hand " + (game.pos + 1) + " of " + game.order.length + ".";
    if (ph === "focusing") return '<div><div class="c-title">' + esc(p.name) + '\u2019s turn</div><div class="c-sub">' + prog + '</div></div>';
    if (ph === "drawing") return '<div><div class="c-title">' + esc(p.name) + '\u2019s turn</div><div class="c-sub">Bet ' + fmt(h.bet) + '. Drawing the betting card<span class="dots"></span></div></div>' + handEl(h, "big", false);
    if (ph === "result") {

      if (game.roundEnded) {
        var nd = game.players[nextActive(game.dealer)];
        extra = '<div class="c-sub">The bank is empty, so round ' + game.round + ' ends. All cards are recollected, everyone adds the boat of ' + fmt(game.ante) + ', and ' + esc(nd.name) + ' deals.</div>';
        label = "Start round " + (game.round + 1);
      }
      var html = handEl(h, "big", ui.justDrew) + '<div class="banner ' + r.kind + '" role="status">' + esc(r.text) + '</div>' + extra + '<div class="c-fill"></div><button class="btn primary" data-act="next">' + label + '</button>';
      ui.justDrew = false;
      return html;
    }
    /* bet phase */

      }
      var geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      var mat = new THREE.PointsMaterial({ size: 0.34 * Math.max(0.6, layout.s), map: sparkTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
      var pts = new THREE.Points(geo, mat); pts.frustumCulled = false; scene.add(pts);
      var last = 0;
      return tween(1300, function (p) {
        var dt = (p - last) * 1.3; last = p;
        for (var j = 0; j < n; j++) {
          vel[j][1] -= 9 * dt;
          pos[j * 3] += vel[j][0] * dt; pos[j * 3 + 1] = Math.max(0.05, pos[j * 3 + 1] + vel[j][1] * dt); pos[j * 3 + 2] += vel[j][2] * dt;
        }
        geo.attributes.position.needsUpdate = true; mat.opacity = 1 - p;
      }).then(function () { scene.remove(pts); geo.dispose(); mat.dispose(); });
    }
    function shake(i) {
      if (reduced) return Promise.resolve();
      var m = hands[i] && hands[i].C, x0 = m ? m.position.x : 0;
      if (!m) return Promise.resolve();
      return tween(450, function (p) { m.position.x = x0 + Math.sin(p * 38) * 0.07 * (1 - p); }).then(function () { m.position.x = x0; });
    }
    function fly(kind, i, count) {
      var seatPt = slot(i, "C"); seatPt.y = 0.6;
      var bankPt = new THREE.Vector3(layout.bank.x, 0.9, layout.bank.z);
      var from = kind === "toPlayer" ? bankPt : seatPt, to = kind === "toPlayer" ? seatPt : bankPt;
      var n = Math.max(1, Math.min(10, count || 3)), chips = [], k;
      for (k = 0; k < n; k++) { var c = new THREE.Mesh(chipGeo, chipMats[k % 3]); c.scale.set(0.8, 0.8, 0.8); c.position.copy(from); c.castShadow = true; scene.add(c); chips.push(c); }
      snd("chips", 520, n);
      return tween(950, function (p) {
        chips.forEach(function (c, j) {
          var lp = Math.min(1, Math.max(0, (p - j * (0.35 / n)) / 0.62)), e = ease(lp);
          c.position.set(from.x + (to.x - from.x) * e, from.y + (to.y - from.y) * e + Math.sin(lp * Math.PI) * 1.5, from.z + (to.z - from.z) * e);
          c.rotation.x = lp * 4;
        });
      }).then(function () { chips.forEach(function (c) { scene.remove(c); }); });
    }

    /* ----- fixed camera that fits the whole table ----- */
    var w = 0, h = 0;
    function fitCamera() {
      var tanV = Math.tan(18 * Math.PI / 180), tanH = tanV * camera.aspect;
      var el = 62 * Math.PI / 180, sinE = Math.sin(el), cosE = Math.cos(el);
      var dist = Math.max((TX + 0.3) / tanH, (TZ * sinE + 0.9 * cosE + 0.5) / tanV) * 1.04;
      camera.position.set(0, dist * sinE, dist * cosE);
      camera.lookAt(0, -0.1, 0);
    }
    function resize() {
      var cw = container.clientWidth, ch = container.clientHeight;
      if (!cw || !ch || (cw === w && ch === h)) return;
      w = cw; h = ch;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      fitCamera();
    }

    /* ----- tap a seat to zoom its hand ----- */
    var ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), downAt = null;
    renderer.domElement.addEventListener("pointerdown", function (e) { downAt = { x: e.clientX, y: e.clientY }; });
    renderer.domElement.addEventListener("pointerup", function (e) {
      if (!downAt || !layout) return;
      var dx = e.clientX - downAt.x, dy = e.clientY - downAt.y; downAt = null;
      if (dx * dx + dy * dy > 100) return;
      var r = renderer.domElement.getBoundingClientRect();
      ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      ray.setFromCamera(ndc, camera);
      var objs = [];
      Object.keys(labels).forEach(function (k) { if (labels[k].visible) objs.push(labels[k]); });
      Object.keys(hands).forEach(function (k) { [hands[k].L, hands[k].R, hands[k].C].forEach(function (m) { if (m.visible) objs.push(m); }); });
      var hit = ray.intersectObjects(objs, false)[0];
      onSeatTap(hit && hit.object.userData.seat != null ? hit.object.userData.seat : -1);
    });

    /* ----- render only when needed, so the table stays perfectly still when idle ----- */
    var running = false;
    function requestRender() { if (!running) { running = true; requestAnimationFrame(frame); } }
    function frame(now) {
      if (!container.offsetParent) { running = false; return; }
      resize();
      for (var i = tweens.length - 1; i >= 0; i--) {
        var tw = tweens[i], el = now - tw.t0 - tw.delay;
        if (el < 0) continue;
        var p = Math.min(1, el / tw.ms);
        tw.step(p);
        if (p >= 1) { tweens.splice(i, 1); tw.res(); }
      }
      renderer.render(scene, camera);
      if (tweens.length) requestAnimationFrame(frame); else running = false;
    }
    if (window.ResizeObserver) new ResizeObserver(function () { resize(); requestRender(); }).observe(container);
    window.addEventListener("resize", function () { resize(); requestRender(); });
    resize();
    requestRender();

    return {
      syncSeats: syncSeats, dealAll: dealAll, focus: focus, reveal: reveal, discardHand: discardHand, discardAll: discardAll, collectAll: collectAll,
      setBank: setBank, setDeck: setDeck, setDiscard: setDiscard, flash: flash, burst: burst, shake: shake, fly: fly
    };
  }

  /* ---------- 2D fallback if WebGL is unavailable ---------- */
  function createStage2D(container, onSeatTap) {
    container.innerHTML = '<div class="s2d" style="position:absolute;inset:0;display:grid;place-items:center;background:#0f4a36;border-radius:18px;padding:8px"></div>';
    var box = container.firstChild;
    function draw(info) {
      var n = info.players.length, cols = Math.min(4, Math.ceil(n / 2));
      box.innerHTML = '<div style="display:grid;grid-template-columns:repeat(' + cols + ',minmax(0,1fr));gap:6px;width:100%">' + info.players.map(function (p, i) {
        var cards = p.hand ? handEl({ c1: p.hand.l, c2: p.hand.r, c3: p.hand.c3, outcome: p.hand.outcome }, "mini", false) : "";
        return '<div data-seat="' + i + '" style="padding:6px;border-radius:10px;background:rgba(0,0,0,.35);color:#eaf4ed;min-width:0;' + (p.state === "active" ? "outline:2px solid #e4b64f;" : "") + '"><div style="font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(p.name) + (i === info.dealer ? " (D)" : "") + '</div><div style="font-size:12px;opacity:.85">' + fmtSigned(p.net) + '</div>' + cards + '</div>';
      }).join("") + '</div>';
    }
    box.addEventListener("click", function (e) { var t = e.target.closest("[data-seat]"); onSeatTap(t ? +t.getAttribute("data-seat") : -1); });
    return {
      syncSeats: draw, dealAll: function () { return wait(500); }, focus: function () { return wait(200); }, reveal: function () { return wait(700); },
      discardHand: function () { return Promise.resolve(); }, discardAll: function () { return Promise.resolve(); }, collectAll: function () { return wait(600); },
      setBank: function () {}, setDeck: function () {}, setDiscard: function () {}, flash: function () {}, burst: function () {}, shake: function () {}, fly: function () {}
    };
  }

  function ensureStage() {
    if (stage) return;
    var box = $("stage");
    try {
      if (typeof THREE === "undefined") throw new Error("three.js not loaded");
      stage = createStage3D(box, function (i) { if (i >= 0) { sfx.play("click"); openZoom(i); } else closeZoom(); });
    } catch (err) {
      box.innerHTML = "";
      stage = createStage2D(box, function (i) { if (i >= 0) openZoom(i); else closeZoom(); });
    }
    if (game) { stage.setDiscard(Math.max(0, game.deckSize - game.deck.length)); render(); }
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {
    var sh = $("sheet");
    if (e.target === sh) { closeSheet(); return; }
    var el = e.target.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act"), i = parseInt(el.getAttribute("data-i"), 10), v = el.getAttribute("data-v"), d = parseInt(el.getAttribute("data-d"), 10);
    sfx.unlock();
    if (act !== "leave" && sheet.armedLeave !== -1) { sheet.armedLeave = -1; if (sheet.open) fillSheetBody(); }

    switch (act) {
      case "openSheet": sfx.play("click"); openSheet(sheet.tab === "rules" && game ? "players" : sheet.tab); return;
      case "openRules": sfx.play("click"); openSheet("rules"); return;
      case "openSettle": sfx.play("click"); openSheet("settle"); return;
      case "closeSheet": sfx.play("click"); closeSheet(); return;
      case "tab": sfx.play("click"); sheet.tab = v; sheet.armedNew = false; renderSheet(); return;
      case "pg": sfx.play("click"); sheet.page[el.getAttribute("data-k")] += d; fillSheetBody(); return;
      case "closeZoom": closeZoom(); return;
      case "mute": sfx.setMuted(!sfx.isMuted()); sfx.play("click"); if (game) $("hud").innerHTML = hudHTML(); return;
      default: break;
    }

    if (!game) {
      if (act === "addPlayer") {
        sfx.play("click"); setup.names.push("Player " + (setup.names.length + 1)); save();
        setupPage = 999; renderSetup();
        var nin = document.querySelector('[data-name="' + (setup.names.length - 1) + '"]'); if (nin) { nin.focus(); nin.select(); }
      } else if (act === "spg") { sfx.play("click"); setupPage += d; renderSetup();
      } else if (act === "removePlayer") { sfx.play("click"); setup.names.splice(i, 1); save(); renderSetup(); }
      else if (act === "anteStep") {
        sfx.play("click");
        var cur = parseFloat(setup.ante); if (!(cur > 0)) cur = 10;
        setup.ante = Math.max(5, Math.round((cur + d) / 5) * 5); save();
        $("ante").value = setup.ante;
      } else if (act === "setRecollect") { sfx.play("click"); setup.recollect = v; save(); renderSetup(); }
      else if (act === "start") {
        var err = startGame();
        if (err) { $("setupErr").textContent = err; sfx.play("error"); return; }
        sfx.play("roundEnd");
        render(); ensureStage(); render(); save();
      }
      return;
    }

    switch (act) {
      case "deal": sfx.play("click"); deal(); break;
      case "play": play(); break;
      case "pass": pass(); break;
      case "next": next(); break;
      case "step": sfx.play("click"); setBet((parseFloat(ui.bet) || 5) + d); break;
      case "quick": {
        sfx.play("click");
        var k = el.getAttribute("data-k"), b = k === "min" ? 5 : k === "boat" ? game.ante : k === "half" ? Math.floor(game.bank / 10) * 5 : maxBet();
        setBet(b); break;
      }
      case "leave":
        if (sheet.armedLeave === i) leave(i);
        else {
          sheet.armedLeave = i; sfx.play("click"); fillSheetBody();
          clearTimeout(timers.leave);
          timers.leave = setTimeout(function () { sheet.armedLeave = -1; if (sheet.open) fillSheetBody(); }, 5000);
        }
        break;
      case "newGame":
        if (!sheet.armedNew) {
          sheet.armedNew = true; sfx.play("click"); fillSheetBody();
          clearTimeout(timers.nw);
          timers.nw = setTimeout(function () { sheet.armedNew = false; if (sheet.open) fillSheetBody(); }, 4000);
        } else {
          clearTimeout(timers.nw); sheet.armedNew = false; busy = false;
          if (stage) { stage.collectAll(); }
          game = null; ui = { bet: "", err: "", justDrew: false, zoomSeat: -1 };
          sheet.open = false; renderSheet(); save(); render();
        }
        break;
      default: break;
    }
  });

  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.hasAttribute("data-name")) { setup.names[parseInt(t.getAttribute("data-name"), 10)] = t.value; save(); return; }
    var k = t.getAttribute("data-in");
    if (k === "ante") { setup.ante = t.value; save(); }
    else if (t.id === "bet" && game) {
      ui.bet = t.value; ui.err = "";
      var gb = $("goBtn"); if (gb) gb.textContent = betLabel();
      setErr();
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { if (sheet.open) closeSheet(); else if (ui.zoomSeat >= 0) closeZoom(); return; }
    if (e.key === "Enter" && e.target && e.target.id === "bet" && game && game.phase === "bet") { e.preventDefault(); play(); }
  });

  window.addEventListener("resize", function () { if (sheet.open) fillSheetBody(); });

  load();
  render();
  if (game) ensureStage();
})();
</script>
</body>
</html>
